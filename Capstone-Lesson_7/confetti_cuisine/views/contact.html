<!-- Debugger version -->

<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=0.8, maximum-scale=1" />
    <title>Confetti Cuisine</title>
    <link rel="stylesheet" href="/bootstrap.css" />
    <link rel="stylesheet" href="/confetti_cuisine.css" />
</head>

<body>
    <div id="nav">
        <div class="col-sm nav-align">
            <h1 id="title">Confetti Cuisine</h1>
        </div>
        <div class="col-sm nav-align">
            <a href="/"> <span class="button">Home</span> </a>
            <a href="/courses.html"> <span class="button">Courses</span> </a>
            <a href="/contact.html"> <span class="button">Contact</span> </a>
        </div>
    </div>

    <div class="container">
        <div class="col-sm-6"><img src="/graph.png" alt="" /></div>
        <div class="col-sm-6">
            <h1>Reach out to us!</h1>
            <p>Enter your email if you're interested to learn more:</p>
            <form class="contact-form" action="/" method="post" id="contactForm">
                <input type="email" name="email" id="emailInput" required />
                <input class="button" type="submit" value="submit" />
            </form>
            <p>We'll get back to you soon!</p>
        </div>
    </div>

    <script>
        // 1. Verification Log: Runs immediately when the page finishes loading
        console.log("=== DEBUGGER STATUS: Script successfully loaded and active ===");
        console.log("Targeting elements -> Form ID: 'contactForm', Input ID: 'emailInput'");

        // Select elements from the DOM
        const form = document.getElementById('contactForm');
        const emailInput = document.getElementById('emailInput');

        // 2. Event Listener: Fires only when the user clicks the submit button
        form.addEventListener('submit', function(event) {
            
            // CRITICAL STEP: Stop the browser from reloading the page so we can read the logs
            event.preventDefault();

            console.log("\n=== DEBUGGER EVENT: Form Submission Intercepted ===");
            console.log("Action Taken: Stopped the default browser page-refresh behavior using event.preventDefault().");
            
            // Read and log metadata from the form element attributes
            console.log("Form Configuration:");
            console.log(" -> Routing Target (Action URL):", form.action);
            console.log(" -> HTTP Method Type:", form.method.toUpperCase());

            // Extract and log the actual real-time value typed by the user
            console.log("Captured Form Data:");
            console.log(" -> User Email Value:", emailInput.value);
            console.log("==================================================\n");

            // Pop up a friendly message on screen to confirm it worked during your demo
            alert("Success! Form intercepted. Look at your browser console to see the logged data.");
        });
    </script>
</body>

</html>
